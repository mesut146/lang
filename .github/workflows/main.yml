
name: test
on:
  push:
    branches: [main]
    tags: ['v*']

#releases are cut by pushing a tag (vX.Y): the tag build bootstraps from
#the previous release tag, tests everything, and publishes all three
#toolchains. Branch pushes only build+test (artifacts named dev-<sha>).
#The three builds are independent jobs (each bootstraps from the last
#release, not from another job) so they run concurrently; publish waits
#for all of them. No version-bump commits, no publish flag.
permissions:
  contents: write
  actions: write

jobs:
  build-x86_64:
    #ubuntu-latest moved to 26.04 (2026-10-24): bin/apt.sh installs `libxml2`
    #(noble, libxml2.so.2), which no longer has an installation candidate
    #there, so the bootstrapping toolchain cannot load libLLVM ("libxml2.so.2:
    #cannot open shared object file"). Pin this job to the image the scripts
    #and the llvm-19 debs target; the other jobs build in their own chroots
    #and were green on 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "set versions"
        run: |
          tags=$(git tag --sort=creatordate | grep -E '^v[0-9]+\.[0-9]+$' || true)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            new_version="${GITHUB_REF_NAME#v}"
            if [[ "$new_version" == "1.14" ]]; then
              #one-off: v1.13's analyzer inserts drops but predates the
              #explicit-drop suppression, so manual+auto double-fire
              #building this tree (x86_64 heap corruption in CI).
              #Bootstrap from v1.11 (drops-off, sound) instead. v1.14+
              #analyzers suppress correctly.
              last_version="1.11"
            else
              last_version=$(echo "$tags" | grep -B1 "^v${new_version}$" | head -1 | sed 's/^v//')
            fi
            [ -z "$last_version" ] && { echo "no previous release tag before v$new_version"; exit 1; }
          else
            last_version=$(echo "$tags" | tail -1 | sed 's/^v//')
            [ -z "$last_version" ] && { echo "no release tag to bootstrap from"; exit 1; }
            new_version="dev-$(git rev-parse --short HEAD)"
          fi
          echo "building $new_version from bootstrap $last_version"
          echo "last_version=$last_version" >> $GITHUB_ENV
          echo "new_version=$new_version" >> $GITHUB_ENV
          echo "toolchain_dir=x-toolchain-${last_version}-$(uname -m)" >> $GITHUB_ENV
          echo "tool2_x86_64_zip=x-toolchain-${new_version}-x86_64.zip" >> $GITHUB_ENV

      - name: "download toolchain"
        run: |
          gh auth status
          gh release download v${last_version}&&echo "download toolchain '$toolchain_dir'"
          unzip $toolchain_dir.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #The LLVM 19 dev packages are a ~76MB apt download into build/tmp that
      #bin/build.sh keeps across its wipe, so caching that directory takes the
      #fetch off the critical path. Without it a slow ubuntu mirror turned the
      #build step into an 11-minute wait (2026-10-22: 28.7MB at 95KB/s, 47.5MB
      #at 158KB/s; the build itself was 60s). restore-keys falls back to an
      #older cache when bin/llvm.sh changes: a stale LLVM 19 is fine, fetching
      #it again is not. The docker jobs fetch their own LLVM into the same
      #build/tmp at run time (arch-specific debs), so they use their own keys
      #below and do not share this one.
      - name: "cache LLVM"
        uses: actions/cache@v4
        with:
          path: build/tmp
          key: llvm19-${{ runner.os }}-${{ hashFiles('bin/llvm.sh', 'bin/apt.sh') }}
          restore-keys: |
            llvm19-${{ runner.os }}-

      - name: build-x86_64
        id: build_x86_64
        run: |
          XOPT="-O2" XSTAGE="1" bin/build.sh $toolchain_dir $new_version

      - name: Upload Artifacts x86_64
        if: ${{ steps.build_x86_64.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          #no .zip suffix on the artifact name: gh run download unpacks
          #each artifact into a folder of that name, and the suffix made
          #it look doubly zipped.
          name: x-toolchain-${{ env.new_version }}-x86_64
          path: ${{ env.tool2_x86_64_zip }}
          compression-level: 0

      - name: test-x86_64
        id: test_x86_64
        run: |
          #MALLOC_CHECK_=3 turns silent heap corruption (the class that
          #passed aarch64/termux while aborting x86_64) into loud aborts.
          #musl/bionic ignore it; glibc enforces it.
          export MALLOC_CHECK_=3
          ./bin/test.sh x-toolchain-${{ env.new_version }}-x86_64 all

  build-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "set versions"
        run: |
          tags=$(git tag --sort=creatordate | grep -E '^v[0-9]+\.[0-9]+$' || true)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            new_version="${GITHUB_REF_NAME#v}"
            if [[ "$new_version" == "1.14" ]]; then
              #one-off: v1.13's analyzer inserts drops but predates the
              #explicit-drop suppression, so manual+auto double-fire
              #building this tree (x86_64 heap corruption in CI).
              #Bootstrap from v1.11 (drops-off, sound) instead. v1.14+
              #analyzers suppress correctly.
              last_version="1.11"
            else
              last_version=$(echo "$tags" | grep -B1 "^v${new_version}$" | head -1 | sed 's/^v//')
            fi
            [ -z "$last_version" ] && { echo "no previous release tag before v$new_version"; exit 1; }
          else
            last_version=$(echo "$tags" | tail -1 | sed 's/^v//')
            [ -z "$last_version" ] && { echo "no release tag to bootstrap from"; exit 1; }
            new_version="dev-$(git rev-parse --short HEAD)"
          fi
          echo "building $new_version from bootstrap $last_version"
          echo "last_version=$last_version" >> $GITHUB_ENV
          echo "new_version=$new_version" >> $GITHUB_ENV
          echo "toolchain_dir=x-toolchain-${last_version}-$(uname -m)" >> $GITHUB_ENV
          echo "toolchain_arm64_dir=x-toolchain-${last_version}-aarch64" >> $GITHUB_ENV
          echo "tool2_arm64_zip=x-toolchain-${new_version}-aarch64.zip" >> $GITHUB_ENV

      - name: "download toolchain"
        run: |
          gh auth status
          gh release download v${last_version}&&echo "download toolchain '$toolchain_dir'"
          unzip $toolchain_dir.zip
          unzip $toolchain_arm64_dir.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #The cross image holds only the environment (debian:sid + the arm64
      #cross packages), not the checkout: bin/docker.sh bind-mounts the
      #workspace, so the image is reusable across commits. Without the cache
      #docker spent ~30s per run exporting/unpacking the COPY-ed tree for a
      #~60s build. Key on what the image actually installs; restore-keys keeps
      #a stale environment usable (apt re-checks it at run time). The termux
      #job builds the same image, so a cold-cache run may save it twice --
      #the second save finds the key and is dropped.
      - name: "cache cross image (arm64)"
        id: cross_image
        uses: actions/cache@v4
        with:
          path: cross-image.tar
          key: cross-image-${{ hashFiles('bin/Dockerfile', 'bin/apt_cross.sh', 'bin/Dockerfile.dockerignore') }}
          restore-keys: |
            cross-image-

      - name: "load cached cross image (arm64)"
        if: steps.cross_image.outputs.cache-hit == 'true'
        run: docker load -i cross-image.tar

      #llvm.sh downloads the arm64 LLVM debs (and the noble runtime deps) into
      #build/tmp once; later runs reuse them. The image does not ship them
      #(the debs are ~100MB and the extracted tree is arch-specific).
      - name: "cache LLVM debs (arm64)"
        uses: actions/cache@v4
        with:
          path: build/tmp
          key: llvm19-arm64-${{ hashFiles('bin/llvm.sh', 'bin/apt.sh') }}
          restore-keys: |
            llvm19-arm64-

      - name: build-arm64
        id: build_arm64
        run: |
          XSAVE_IMAGE="${{ steps.cross_image.outputs.cache-hit != 'true' }}" XOPT="-O2" XSTAGE="1" ./bin/docker.sh $toolchain_dir $toolchain_arm64_dir $new_version

      - name: Upload Artifacts arm64
        if: ${{ steps.build_arm64.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: x-toolchain-${{ env.new_version }}-aarch64
          path: ${{ env.tool2_arm64_zip }}
          compression-level: 0

  build-termux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "set versions"
        run: |
          tags=$(git tag --sort=creatordate | grep -E '^v[0-9]+\.[0-9]+$' || true)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            new_version="${GITHUB_REF_NAME#v}"
            if [[ "$new_version" == "1.14" ]]; then
              #one-off: v1.13's analyzer inserts drops but predates the
              #explicit-drop suppression, so manual+auto double-fire
              #building this tree (x86_64 heap corruption in CI).
              #Bootstrap from v1.11 (drops-off, sound) instead. v1.14+
              #analyzers suppress correctly.
              last_version="1.11"
            else
              last_version=$(echo "$tags" | grep -B1 "^v${new_version}$" | head -1 | sed 's/^v//')
            fi
            [ -z "$last_version" ] && { echo "no previous release tag before v$new_version"; exit 1; }
          else
            last_version=$(echo "$tags" | tail -1 | sed 's/^v//')
            [ -z "$last_version" ] && { echo "no release tag to bootstrap from"; exit 1; }
            new_version="dev-$(git rev-parse --short HEAD)"
          fi
          echo "building $new_version from bootstrap $last_version"
          echo "last_version=$last_version" >> $GITHUB_ENV
          echo "new_version=$new_version" >> $GITHUB_ENV
          echo "toolchain_dir=x-toolchain-${last_version}-$(uname -m)" >> $GITHUB_ENV
          echo "toolchain_termux_dir=x-toolchain-${last_version}-termux-aarch64" >> $GITHUB_ENV
          echo "tool2_termux_zip=x-toolchain-${new_version}-termux-aarch64.zip" >> $GITHUB_ENV

      - name: "download toolchain"
        run: |
          gh auth status
          gh release download v${last_version}&&echo "download toolchain '$toolchain_dir'"
          unzip $toolchain_dir.zip
          unzip -n ${{ env.toolchain_termux_dir }}.zip || echo "no termux bootstrap toolchain present"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #Same image as the arm64 job: the termux build needs the arm64 cross
      #packages (bin/apt_cross.sh) but not the NDK, which is arch-independent
      #and downloads fast, so apt_cross.sh fetches it at run time instead of
      #baking it into the cache. It used to be COPY-ed into the build context
      #and the image was rebuilt with --no-cache --pull every run: ~2 minutes
      #of layer export/unpack (the NDK included) around a ~90s build.
      - name: "cache cross image (termux)"
        id: cross_image
        uses: actions/cache@v4
        with:
          path: cross-image.tar
          key: cross-image-${{ hashFiles('bin/Dockerfile', 'bin/apt_cross.sh', 'bin/Dockerfile.dockerignore') }}
          restore-keys: |
            cross-image-

      - name: "load cached cross image (termux)"
        if: steps.cross_image.outputs.cache-hit == 'true'
        run: docker load -i cross-image.tar

      #llvm.sh only needs the llvm-19 headers under termux; the deb is fetched
      #into build/tmp once and then reused (the container sees the same path
      #through the bind-mounted checkout).
      - name: "cache LLVM headers (termux)"
        uses: actions/cache@v4
        with:
          path: build/tmp
          key: llvm19-termux-${{ hashFiles('bin/llvm.sh') }}
          restore-keys: |
            llvm19-termux-

      - name: build-termux
        id: build_termux
        run: |
          XSAVE_IMAGE="${{ steps.cross_image.outputs.cache-hit != 'true' }}" XOPT="-O2" XSTAGE="" ./bin/docker_termux.sh ${{ env.toolchain_dir }} ${{ env.new_version }} ${{ env.toolchain_termux_dir }}

      - name: Upload Artifacts termux
        if: ${{ steps.build_termux.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: x-toolchain-${{ env.new_version }}-termux-aarch64
          path: ${{ env.tool2_termux_zip }}
          compression-level: 0

  publish:
    needs: [build-x86_64, build-aarch64, build-termux]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          generate_release_notes: true
